qa_backbone:
  name: "deepset/roberta-base-squad2"
  # Projenin tüm ana QA deneylerinde kullanılan pretrained
  # extractive question-answering backbone.

  task: "extractive_question_answering"
  # Model verilen context içinden bir answer span seçer;
  # free-form text generation yapmaz.

  tokenizer: "deepset/roberta-base-squad2"
  # QA modelinin kendi tokenizer'ı kullanılır.

  revision: null
  # Belirli bir Hugging Face model revision'ı şu anda pinlenmemiştir.
  # null, repository'nin varsayılan revision'ının kullanıldığını belirtir.

  fine_tuned_in_project: false
  # QA backbone bu proje kapsamında train veya fine-tune edilmez.
  # Pretrained checkpoint doğrudan inference için kullanılır.

  shared_across_baselines: true
  # Forced-answer ve native no-answer baseline aynı QA backbone'u kullanır.
  # Böylece karşılaştırma model değişikliğinden değil,
  # abstention/ranking davranışından kaynaklanır.


dataset_interface:
  processed_dataset_path: "data/processed/squad_v2"
  # Model inference için hazırlanan SQuAD v2 DatasetDict.

  question_field: "question"
  # Modelin question input alanı.

  context_field: "context"
  # Modelin answer span aradığı context alanı.

  reference_answers_field: "answers"
  # Gold/reference cevapların dataset içindeki alanı.

  answerability_field: "is_answerable"
  # prepare_data.py tarafından eklenen binary answerability alanı.


forced_answer_baseline:
  enabled: true
  # Final selective-ranking deneylerinin ortak QA candidate üretim aşaması.

  handle_impossible_answer: false
  # Modelin native no-answer seçeneği kapatılır.
  # Her örnek için bir non-empty answer span üretilmeye çalışılır.

  top_k: 5
  # Pipeline ilk beş candidate span'i döndürür.
  # En yüksek sıralı geçerli ve non-empty span seçilir.

  require_non_empty_span: true
  # Forced-answer candidate boş olamaz.

  require_valid_character_span: true
  # Candidate'ın end character index'i start index'ten büyük olmalıdır.

  raw_score_field: "pipeline_score"
  # Hugging Face QA pipeline tarafından verilen ham span score.
  # Bu değer final calibrated confidence değildir.

  final_decision: "forced_answer_candidate"
  # Bu aşamada abstention yapılmaz.
  # Üretilen answer candidate daha sonra confidence ve verifier
  # sinyalleriyle selective ranking için değerlendirilir.


native_no_answer_baseline:
  enabled: true
  # Aynı QA backbone'un kendi no-answer davranışını ölçen comparison baseline.

  handle_impossible_answer: true
  # Model native SQuAD v2 null/no-answer seçeneğini kullanabilir.

  top_k: 1
  # Modelin en yüksek skorlu final seçimi kullanılır.

  empty_prediction_action: "ABSTAIN"
  # Model boş answer döndürürse project-level action ABSTAIN olur.

  non_empty_prediction_action: "ANSWER"
  # Model non-empty span döndürürse action ANSWER olur.

  shared_backbone_with_forced_answer: true
  # Forced-answer karşılaştırmasıyla aynı model checkpoint'i kullanılır.


confidence_estimation:
  enabled: true
  # Forced-answer candidate'lar için model-internal confidence sinyali çıkarılır.

  model_name: "deepset/roberta-base-squad2"
  # Confidence, cevabı üreten aynı QA backbone'dan hesaplanır.

  method: "answer_vs_null_logit_margin"
  # Forced-answer span score ile modelin null/no-answer score'u karşılaştırılır.

  answer_score:
    definition: "start_logit(answer_start) + end_logit(answer_end)"
    # Candidate answer span için kullanılan raw logit score.

  null_score:
    definition: "start_logit(CLS) + end_logit(CLS)"
    # CLS token position modelin null/no-answer position'ı olarak kullanılır.

  margin:
    definition: "answer_score - null_score"
    # Pozitif margin answer span'i;
    # negatif margin null/no-answer seçeneğini daha fazla destekler.

  uncalibrated_transform: "sigmoid"
  # Raw margin sigmoid ile [0, 1] aralığına dönüştürülür.
  # Bu değer temperature scaling uygulanmadan önce
  # calibrated probability olarak yorumlanmaz.

  output_field: "uncalibrated_confidence"
  # Temperature scaling öncesindeki confidence signal.


tokenization:
  maximum_length: 384
  # Confidence estimation sırasında question + context +
  # special tokens için kullanılan maximum token length.

  document_stride: 128
  # Uzun context'ler overlapping chunk'lara ayrılırken
  # komşu chunk'lar arasında tekrar kullanılan token miktarı.

  truncation: "only_second"
  # Uzun input durumunda context tarafı chunk'lanır;
  # question korunur.

  return_offsets_mapping: true
  # Character-level forced-answer span'in token position'larına
  # eşlenebilmesi için offset mapping gerekir.


calibration:
  enabled: true
  # Uncalibrated answer-vs-null confidence daha sonra
  # probability calibration işleminden geçirilir.

  method: "temperature_scaling"
  # Tek temperature parametresi calibration split üzerinde fit edilir.

  fit_split: "calibration"
  # Temperature yalnızca calibration labels kullanılarak seçilir.

  apply_split: "test"
  # Fitted temperature frozen halde held-out test confidence'ına uygulanır.

  fit_on_test_set: false
  # Held-out test correctness temperature parameter seçimini etkilemez.

  calibrated_output_field: "calibrated_confidence"
  # Final selective-ranking deneyinde kullanılan confidence alanı.


inference:
  default_device: "cpu"
  # Canonical experiment script'in varsayılan çalışma cihazı CPU'dur.

  supported_devices:
    - "cpu"
    - "cuda"
    - "mps"
  # İlgili hardware backend mevcutsa CLI üzerinden seçilebilir.

  device_controlled_by_runtime: true
  # Gerçek experiment scriptleri device değerini CLI/environment
  # üzerinden seçer; model.yaml script davranışını otomatik override etmez.


reproducibility:
  deterministic_candidate_selection: true
  # Aynı model output'u içindeki candidate seçim kuralı deterministiktir.

  project_seed: 17
  # Project-level deterministic ordering ve sampling protokolünün seed'i.

  model_revision_pinned: false
  # Şu anda exact Hugging Face model revision hash'i pinlenmemiştir.
  # Bu durum reproducibility limitation olarak açıkça kaydedilir.