project:
  name: "Knowing-When-Not-to-Answer"
  # Projenin adı.

  task: "selective_question_answering"
  # Selective QA görevini tanımlar.
  # Sistem, QA adaylarını güven ve doğrulama sinyalleriyle sıralar
  # ve gerektiğinde cevap vermemeyi (abstention) destekler.

  experiment_name: "default_experiment"
  # Çalıştırılan deney için genel isim.


reproducibility:
  seed: 17
  # Veri bölme, örnek sıralama ve diğer rastgele işlemlerde
  # kullanılan canonical reproducibility seed'i.

  deterministic: true
  # Mümkün olan bileşenlerde deterministik çalışmayı hedefler.
  # Donanım veya bazı ML operasyonları tam bit-level determinism
  # garanti etmeyebilir.


paths:
  raw_data_dir: "data/raw"
  # İndirilen ham veri kümesinin bulunduğu klasör.

  processed_data_dir: "data/processed"
  # Hazırlanmış calibration ve held-out split'lerin bulunduğu klasör.

  output_dir: "outputs"
  # Deney tahminleri, tablolar ve diğer sayısal çıktıların ana klasörü.

  predictions_dir: "outputs/predictions"
  # Model ve verifier tahminlerinin kaydedildiği klasör.

  figures_dir: "assets/figures"
  # Final dokümantasyon ve paper için kullanılan canonical figure klasörü.

  tables_dir: "outputs/tables"
  # Sonuç tablolarının kaydedildiği klasör.

  logs_dir: "outputs/logs"
  # Çalışma loglarının kaydedildiği klasör.


runtime:
  device: "auto"
  # Uygun olduğunda CPU, CUDA veya MPS cihazının seçilmesini sağlar.

  batch_size: 16
  # Config-aware bileşenler için genel batch-size varsayılanı.
  # Bazı scriptler kendi CLI/default değerlerini kullanabilir.

  num_workers: 0
  # Veri yükleme için ek worker sayısı.
  # 0, yüklemenin ana process üzerinden yapılması anlamına gelir.


decision_space:
  answer_label: "ANSWER"
  # Sistemin cevabı kullanıcıya sunmayı seçtiği routing action.

  verify_label: "VERIFY"
  # Tarihsel threshold/routing pipeline'ında ek doğrulama gerektiren ara action.
  # Final held-out ranking deneylerinde bağımsız bir son cevap sınıfı değildir.

  abstain_label: "ABSTAIN"
  # Sistemin cevap vermemeyi seçtiği routing action.


logging:
  level: "INFO"
  # Varsayılan log seviyesi.

  save_predictions: true
  # Destekleyen çalıştırıcılarda prediction artifact'lerini kaydetmeyi ister.

  save_metrics: true
  # Destekleyen çalıştırıcılarda hesaplanan metrikleri kaydetmeyi ister.

  save_config: true
  # Destekleyen çalıştırıcılarda kullanılan config bilgisini kaydetmeyi ister.


evaluation:
  primary_metric: "aurc"
  # Final selective-QA ranking karşılaştırmasının ana metriği:
  # Area Under the Risk-Coverage Curve (AURC).
  # Daha düşük AURC daha iyi ranking performansı anlamına gelir.

  report_accuracy: true
  # Tüm adaylar üzerindeki correctness oranını raporlamayı etkinleştirir.

  report_coverage: true
  # Seçili operating point'lerde cevaplanan örnek oranını raporlar.

  report_abstention_rate: true
  # Cevap verilmeyen örneklerin oranını raporlar.

  report_false_confidence_rate: true
  # Yanlış fakat yüksek güvenli adayların analizini etkinleştirir.

  report_unsupported_answer_rate: true
  # Verifier tarafından zayıf veya desteksiz görülen cevapların
  # analizini etkinleştirir.

  report_calibration: true
  # Confidence probability calibration metriklerini raporlamayı etkinleştirir.


experiment:
  use_test_set_for_tuning: false
  # Held-out test etiketleri calibration, threshold veya fusion
  # parametre seçimi için kullanılmaz.

  overwrite_outputs: false
  # Varsayılan olarak mevcut experiment artifact'lerinin üzerine yazılmaz.
  # Temiz yeniden üretim gerektiğinde eski artifact'ler açıkça kaldırılmalıdır.