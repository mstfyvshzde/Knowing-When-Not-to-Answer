<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="460"
  viewBox="0 0 1400 460"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Knowing When Not to Answer</title>
  <desc id="description">
    A research framework for reliable selective question answering.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="18"
        flood-color="#0F172A"
        flood-opacity="0.08"
      />
    </filter>
  </defs>

  <rect width="1400" height="460" rx="28" fill="url(#background)" />

  <circle cx="1280" cy="70" r="150" fill="#DBEAFE" opacity="0.7" />
  <circle cx="1180" cy="390" r="190" fill="#E0E7FF" opacity="0.55" />
  <circle cx="110" cy="420" r="130" fill="#BFDBFE" opacity="0.35" />

  <rect
    x="70"
    y="55"
    width="1260"
    height="350"
    rx="24"
    fill="#FFFFFF"
    fill-opacity="0.78"
    stroke="#E2E8F0"
    filter="url(#shadow)"
  />

  <rect
    x="115"
    y="95"
    width="210"
    height="36"
    rx="18"
    fill="#EFF6FF"
    stroke="#BFDBFE"
  />

  <text
    x="220"
    y="119"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="16"
    font-weight="600"
    fill="#2563EB"
    letter-spacing="1.4"
  >
    TRUSTWORTHY AI RESEARCH
  </text>

  <text
    x="115"
    y="205"
    font-family="Inter, Arial, sans-serif"
    font-size="58"
    font-weight="750"
    fill="#0F172A"
    letter-spacing="-1.8"
  >
    Knowing When Not to Answer
  </text>

  <rect
    x="115"
    y="230"
    width="520"
    height="5"
    rx="2.5"
    fill="url(#accent)"
  />

  <text
    x="115"
    y="285"
    font-family="Inter, Arial, sans-serif"
    font-size="27"
    font-weight="500"
    fill="#334155"
  >
    A Modular Research Framework for
  </text>

  <text
    x="115"
    y="324"
    font-family="Inter, Arial, sans-serif"
    font-size="27"
    font-weight="500"
    fill="#334155"
  >
    Reliable Selective Question Answering
  </text>

  <g
    font-family="Inter, Arial, sans-serif"
    font-size="16"
    font-weight="600"
    fill="#475569"
  >
    <rect x="115" y="352" width="225" height="38" rx="19" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="227.5" y="377" text-anchor="middle">Confidence Calibration</text>

    <rect x="356" y="352" width="215" height="38" rx="19" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="463.5" y="377" text-anchor="middle">Evidence Verification</text>

    <rect x="587" y="352" width="190" height="38" rx="19" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="682" y="377" text-anchor="middle">Reliable Abstention</text>
  </g>

  <g transform="translate(1070 145)">
    <circle cx="90" cy="90" r="88" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
    <circle cx="90" cy="90" r="58" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2" />

    <path
      d="M55 92 L79 116 L128 66"
      fill="none"
      stroke="#2563EB"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M90 0 A90 90 0 0 1 180 90"
      fill="none"
      stroke="#2563EB"
      stroke-width="8"
      stroke-linecap="round"
    />

    <circle cx="90" cy="0" r="7" fill="#2563EB" />
    <circle cx="180" cy="90" r="7" fill="#2563EB" />
  </g>
